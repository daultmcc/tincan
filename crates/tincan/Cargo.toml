[package]
name = "tincan"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tincan-audio = { version = "0.1.0", path = "../tincan-audio" }
tincan-core = { version = "0.1.0", path = "../tincan-core" }

[build-dependencies]
cxx-qt-build = "0.10"
